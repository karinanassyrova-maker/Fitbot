<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ритм — трекер жизни</title>
<style>
  :root{
    --paper:#F6F2E8;
    --paper-2:#FCFAF4;
    --ink:#26332C;
    --ink-soft:#5B6A60;
    --line:#E3DAC4;
    --plum:#8B3A62;
    --plum-ink:#4C1F35;
    --mustard:#D9A441;
    --mustard-ink:#6B4E17;
    --sky:#4F7C8C;
    --sky-ink:#294753;
    --moss:#5C7A4A;
    --moss-ink:#33461F;
    --coral:#C15B3F;
    --coral-ink:#6C2E1D;
    --indigo:#5C5A9C;
    --indigo-ink:#302E5A;
    --rose:#A14A6E;
    --rose-ink:#5C2740;
    --teal:#3E7C74;
    --teal-ink:#1F413C;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    display:flex;
    min-height:100vh;
  }
  ::selection{background:var(--mustard);color:var(--ink);}
  .spine{
    width:96px;
    flex-shrink:0;
    background:var(--paper-2);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    padding:20px 0;
  }
  .brand{
    font-family:Georgia,'Times New Roman',serif;
    font-size:20px;
    font-weight:700;
    text-align:center;
    letter-spacing:0.04em;
    color:var(--ink);
    margin-bottom:24px;
  }
  .brand span{color:var(--plum);}
  .tab{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    padding:14px 4px;
    cursor:pointer;
    border-left:3px solid transparent;
    color:var(--ink-soft);
    font-size:11px;
    text-align:center;
    line-height:1.2;
    transition:background .15s;
  }
  .tab:hover{background:rgba(0,0,0,0.03);}
  .tab.active{
    color:var(--ink);
    font-weight:600;
    background:var(--paper);
  }
  .tab .dot{width:8px;height:8px;border-radius:50%;}
  .tab[data-tab="finance"].active{border-left-color:var(--moss);}
  .tab[data-tab="steps"].active{border-left-color:var(--sky);}
  .tab[data-tab="nutrition"].active{border-left-color:var(--mustard);}
  .tab[data-tab="ai"].active{border-left-color:var(--plum);}
  .tab[data-tab="tracker"].active{border-left-color:var(--coral);}
  .tab[data-tab="calendar"].active{border-left-color:var(--indigo);}
  .tab[data-tab="blog"].active{border-left-color:var(--ink);}
  .tab[data-tab="home"].active{border-left-color:var(--rose);}
  .tab[data-tab="profile"].active{border-left-color:var(--teal);}
  .tab[data-tab="finance"] .dot{background:var(--moss);}
  .tab[data-tab="steps"] .dot{background:var(--sky);}
  .tab[data-tab="nutrition"] .dot{background:var(--mustard);}
  .tab[data-tab="ai"] .dot{background:var(--plum);}
  .tab[data-tab="tracker"] .dot{background:var(--coral);}
  .tab[data-tab="calendar"] .dot{background:var(--indigo);}
  .tab[data-tab="blog"] .dot{background:var(--ink);}
  .tab[data-tab="home"] .dot{background:var(--rose);}
  .tab[data-tab="profile"] .dot{background:var(--teal);}

  main{flex:1;min-width:0;padding:28px 32px 60px;max-width:760px;}
  .today{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:4px;
    text-transform:capitalize;
  }
  h1{
    font-family:Georgia,'Times New Roman',serif;
    font-size:26px;
    margin:0 0 18px;
  }
  .card{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 18px;
    margin-bottom:14px;
  }
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .row > *{flex:1;min-width:110px;}
  label{font-size:12px;color:var(--ink-soft);display:block;margin-bottom:4px;}
  input,select,textarea{
    width:100%;
    font-size:14px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:7px;
    background:#fff;
    color:var(--ink);
    font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--mustard);outline-offset:1px;}
  textarea{resize:vertical;min-height:70px;}
  button{
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    padding:9px 16px;
    border-radius:7px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper-2);
    cursor:pointer;
    flex:none !important;
  }
  button:hover{opacity:0.88;}
  button.ghost{background:transparent;color:var(--ink);}
  .btn-row{display:flex;gap:8px;margin-top:10px;}
  .muted{color:var(--ink-soft);font-size:13px;}
  .list{display:flex;flex-direction:column;gap:0;}
  .list-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;gap:10px;
  }
  .list-item:last-child{border-bottom:none;}
  button.del{cursor:pointer;color:var(--ink-soft);font-size:12px;border:none;background:none;padding:2px 6px;}
  button.del:hover{color:var(--coral);}
  .tag{
    display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;
    background:rgba(92,122,74,0.15);color:var(--moss-ink);font-weight:600;
  }
  .stat-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .stat{
    background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 16px;flex:1;min-width:130px;
  }
  .stat .num{font-family:Georgia,serif;font-size:22px;font-weight:700;}
  .stat .lbl{font-size:12px;color:var(--ink-soft);}
  .bar-track{background:var(--line);border-radius:20px;height:10px;overflow:hidden;margin-top:6px;}
  .bar-fill{height:100%;border-radius:20px;}
  .sticky-bar{
    position:sticky;top:0;z-index:5;
    background:var(--mustard);
    color:var(--mustard-ink);
    border-radius:var(--radius);
    padding:12px 16px;
    margin-bottom:16px;
    display:flex;gap:18px;flex-wrap:wrap;
    font-size:13px;
    box-shadow:0 2px 6px rgba(0,0,0,0.06);
  }
  .sticky-bar b{font-size:15px;}
  .subtab-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .subtab{
    padding:6px 14px;border-radius:20px;border:1px solid var(--line);
    font-size:13px;cursor:pointer;background:var(--paper-2);color:var(--ink-soft);
  }
  .subtab.active{background:var(--ink);color:var(--paper-2);border-color:var(--ink);}
  .empty{color:var(--ink-soft);font-size:13px;padding:14px 0;font-style:italic;}
  .chat-wrap{display:flex;flex-direction:column;height:520px;}
  .chat-log{flex:1;overflow-y:auto;padding:6px 2px;display:flex;flex-direction:column;gap:10px;}
  .msg{max-width:82%;padding:9px 13px;border-radius:12px;font-size:14px;line-height:1.5;white-space:pre-wrap;}
  .msg.user{align-self:flex-end;background:var(--ink);color:var(--paper-2);border-bottom-right-radius:3px;}
  .msg.assistant{align-self:flex-start;background:var(--paper-2);border:1px solid var(--line);border-bottom-left-radius:3px;}
  .chat-input-row{display:flex;gap:8px;margin-top:10px;}
  .chat-input-row textarea{min-height:44px;max-height:120px;}
  .book-item{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:var(--paper-2);}
  .book-title{font-weight:600;font-size:14px;}
  .check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;}
  .check-item{
    display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;
    padding:9px 11px;font-size:13px;background:var(--paper-2);cursor:pointer;
  }
  .check-item input{width:auto;}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-head .nav-btn{padding:6px 12px;font-size:13px;}
  .cal-month{font-family:Georgia,serif;font-size:17px;text-transform:capitalize;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-dow{font-size:11px;color:var(--ink-soft);text-align:center;padding-bottom:6px;}
  .cal-cell{
    aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:var(--paper-2);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    cursor:pointer;font-size:13px;position:relative;
  }
  .cal-cell.empty{visibility:hidden;}
  .cal-cell:hover{border-color:var(--indigo);}
  .cal-cell.selected{background:var(--indigo);color:#fff;border-color:var(--indigo);}
  .cal-cell.today:not(.selected){border-color:var(--ink);font-weight:700;}
  .cal-dots{display:flex;gap:2px;}
  .cal-dots span{width:5px;height:5px;border-radius:50%;background:var(--indigo);}
  .cal-cell.selected .cal-dots span{background:#fff;}
  .cal-cell.done .cal-dots span{background:var(--moss);}
  .cal-cell.selected.done .cal-dots span{background:#fff;}
  .workout-item{
    display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid var(--line);padding:10px 0;
  }
  .workout-item:last-child{border-bottom:none;}
  .workout-item input[type=checkbox]{width:auto;margin-top:3px;}
  .workout-item .wi-title{font-weight:600;font-size:14px;}
  .workout-item.done .wi-title{text-decoration:line-through;color:var(--ink-soft);}
  .quote-card{
    background:var(--ink);color:var(--paper-2);border-radius:var(--radius);
    padding:22px 24px;margin-bottom:18px;
  }
  .quote-text{font-family:Georgia,serif;font-size:19px;line-height:1.5;font-style:italic;margin-bottom:10px;}
  .quote-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;opacity:0.7;}
  .quote-foot button{background:transparent;border-color:rgba(255,255,255,0.4);color:var(--paper-2);padding:5px 12px;font-size:12px;}
  .fill-row{margin-bottom:14px;}
  .fill-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;}
  .fill-head .fname{font-weight:600;}
  .goal-item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:9px 0;font-size:14px;}
  .goal-item:last-child{border-bottom:none;}
  .weight-row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:8px 0;font-size:14px;}
  .weight-row:last-child{border-bottom:none;}
  .custom-item{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:var(--paper-2);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .custom-item .ci-name{font-weight:600;font-size:14px;}
  .custom-item .ci-desc{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .custom-item label{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;white-space:nowrap;}
  .custom-item input[type=checkbox]{width:auto;}
  .blog-post{border-bottom:1px solid var(--line);padding:14px 0;}
  .blog-post h3{margin:0 0 4px;font-family:Georgia,serif;font-size:18px;}
  .blog-date{font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  .blog-text{font-size:14px;line-height:1.6;white-space:pre-wrap;}
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
  @media (max-width:640px){
    body{flex-direction:column;}
    .spine{width:100%;flex-direction:row;overflow-x:auto;padding:10px 6px;}
    .tab{flex-direction:row;padding:8px 12px;border-left:none;border-bottom:3px solid transparent;white-space:nowrap;}
    .tab.active{border-bottom-color:var(--ink);border-left:none;}
    main{padding:18px;}
  }
</style>
</head>
<body>

<nav class="spine" id="spine">
  <div class="brand">Р<span>и</span>тм</div>
  <div class="tab active" data-tab="home"><span class="dot"></span>Главная</div>
  <div class="tab" data-tab="finance"><span class="dot"></span>Финансы</div>
  <div class="tab" data-tab="steps"><span class="dot"></span>Шаги</div>
  <div class="tab" data-tab="nutrition"><span class="dot"></span>Рацион</div>
  <div class="tab" data-tab="ai"><span class="dot"></span>Ассистент</div>
  <div class="tab" data-tab="tracker"><span class="dot"></span>Трекер</div>
  <div class="tab" data-tab="calendar"><span class="dot"></span>Календарь</div>
  <div class="tab" data-tab="profile"><span class="dot"></span>Мои данные</div>
  <div class="tab" data-tab="blog"><span class="dot"></span>Блог</div>
</nav>

<main id="main"></main>

<script>
const state = {
  finance: { transactions: [] },
  steps: { records: {} },
  nutrition: { target: { cal: 2000, protein: 120, fat: 60, carb: 220 }, entries: [] },
  trackers: { water: {}, books: [], skincare: {}, skincareTasks: null, custom: [], customLog: {} },
  blog: { posts: [] },
  chat: { messages: [] },
  calendar: { workouts: [] },
  home: { quoteText:'', quoteDate:'' },
  profile: { height:null, weightLog: [], goals: [], notes: [] }
};

let activeTab = 'home';
let nutritionSubtab = 'today';
let trackerSubtab = 'water';
let financeSubtab = 'ops';
let calView = null;
let calSelected = null;

function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('ru-RU', { day:'numeric', month:'long', year:'numeric' });
}
function isWeekend(iso){
  const day = new Date(iso+'T00:00:00').getDay();
  return day === 0 || day === 6;
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function money(n){ return Number(n).toLocaleString('ru-RU') + ' ₸'; }

async function loadAll(){
  const keys = ['finance','steps','nutrition','trackers','blog','chat','calendar','home','profile'];
  for(const k of keys){
    try{
      const res = await window.storage.get('rhythm-'+k, false);
      if(res && res.value) state[k] = JSON.parse(res.value);
    }catch(e){ /* not found yet, keep default */ }
  }
  if(!state.finance.transactions){
    const legacy = state.finance.expenses || [];
    state.finance.transactions = legacy.map(e=>({ ...e, type:'expense' }));
    delete state.finance.expenses;
  }
  if(!state.trackers.custom) state.trackers.custom = [];
  if(!state.trackers.customLog) state.trackers.customLog = {};
  if(!state.trackers.skincareTasks) state.trackers.skincareTasks = ['Умывание утро','Умывание вечер','Крем','SPF','Маска'];
  if(!state.calendar) state.calendar = { workouts: [] };
  if(!state.home) state.home = { quoteText:'', quoteDate:'' };
  if(!state.profile) state.profile = { height:null, weightLog: [], goals: [], notes: [] };
  calView = { year: new Date().getFullYear(), month: new Date().getMonth() };
  calSelected = todayISO();
  render();
  if(state.home.quoteDate !== todayISO()) fetchDailyQuote();
}
async function save(key){
  try{
    await window.storage.set('rhythm-'+key, JSON.stringify(state[key]), false);
  }catch(e){ console.error('storage error', e); }
}

function switchTab(tab){
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===tab));
  render();
}
document.getElementById('spine').addEventListener('click', e=>{
  const t = e.target.closest('.tab');
  if(t) switchTab(t.dataset.tab);
});

function render(){
  const main = document.getElementById('main');
  main.innerHTML = `<div class="today">${fmtDate(todayISO())}</div>`;
  if(activeTab==='home') renderHome(main);
  else if(activeTab==='finance') renderFinance(main);
  else if(activeTab==='steps') renderSteps(main);
  else if(activeTab==='nutrition') renderNutrition(main);
  else if(activeTab==='ai') renderAI(main);
  else if(activeTab==='tracker') renderTracker(main);
  else if(activeTab==='calendar') renderCalendar(main);
  else if(activeTab==='profile') renderProfile(main);
  else if(activeTab==='blog') renderBlog(main);
}

/* ---------- FINANCE ---------- */
const expenseCats = ['Еда','Транспорт','Быт','Здоровье','Развлечения','Одежда','Другое'];
const incomeCats = ['Зарплата','Фриланс','Подарок','Другое'];

function renderFinance(main){
  const today = todayISO();
  const monthPrefix = today.slice(0,7);
  const tx = state.finance.transactions;

  main.innerHTML += `
    <h1>Финансы</h1>
    <div class="subtab-row">
      <div class="subtab ${financeSubtab==='ops'?'active':''}" data-sub="ops">Операции</div>
      <div class="subtab ${financeSubtab==='analytics'?'active':''}" data-sub="analytics">Аналитика за месяц</div>
    </div>
  `;
  if(financeSubtab==='analytics'){ renderFinanceAnalytics(main, tx, monthPrefix); return wireFinanceSubtabs(main); }

  const todayExpense = tx.filter(t=>t.date===today && t.type==='expense').reduce((s,t)=>s+Number(t.amount),0);
  const todayIncome = tx.filter(t=>t.date===today && t.type==='income').reduce((s,t)=>s+Number(t.amount),0);

  main.innerHTML += `
    <div class="stat-row">
      <div class="stat"><div class="num" style="color:var(--coral-ink);">${money(todayExpense)}</div><div class="lbl">расходы сегодня</div></div>
      <div class="stat"><div class="num" style="color:var(--moss-ink);">${money(todayIncome)}</div><div class="lbl">доходы сегодня</div></div>
    </div>
    <div class="card">
      <div class="row">
        <div><label>Тип</label>
          <select id="f-type">
            <option value="expense">Расход</option>
            <option value="income">Доход</option>
          </select>
        </div>
        <div><label>Сумма, ₸</label><input type="number" id="f-amount" placeholder="0"></div>
        <div><label>Категория</label>
          <select id="f-category">${expenseCats.map(c=>`<option>${c}</option>`).join('')}</select>
        </div>
        <div><label>Заметка</label><input type="text" id="f-note" placeholder="необязательно"></div>
      </div>
      <div class="btn-row"><button id="f-add">Добавить</button></div>
    </div>
    <div class="card">
      <div class="muted" style="margin-bottom:8px;">Последние операции</div>
      <div class="list" id="f-list">
        ${tx.slice().reverse().slice(0,40).map(t=>`
          <div class="list-item">
            <span><span class="tag" style="${t.type==='income'?'background:rgba(92,122,74,0.15);color:var(--moss-ink);':'background:rgba(193,91,63,0.15);color:var(--coral-ink);'}">${t.category}</span> ${t.note?('&nbsp;'+t.note):''}</span>
            <span style="display:flex;align-items:center;gap:10px;">
              <span style="color:${t.type==='income'?'var(--moss-ink)':'var(--coral-ink)'};">${t.type==='income'?'+':'−'}${money(t.amount)}</span>
              <button class="del" data-id="${t.id}">убрать</button>
            </span>
          </div>
        `).join('') || '<div class="empty">Пока нет операций</div>'}
      </div>
    </div>
  `;
  const typeSel = main.querySelector('#f-type');
  const catSel = main.querySelector('#f-category');
  typeSel.onchange = ()=>{
    const cats = typeSel.value==='income' ? incomeCats : expenseCats;
    catSel.innerHTML = cats.map(c=>`<option>${c}</option>`).join('');
  };
  main.querySelector('#f-add').onclick = ()=>{
    const amount = parseFloat(main.querySelector('#f-amount').value);
    if(!amount || amount<=0) return;
    const type = typeSel.value;
    const category = catSel.value;
    const note = main.querySelector('#f-note').value.trim();
    state.finance.transactions.push({ id:uid(), date:today, type, amount, category, note });
    save('finance'); render();
  };
  main.querySelectorAll('#f-list .del').forEach(b=>{
    b.onclick = ()=>{
      state.finance.transactions = state.finance.transactions.filter(t=>t.id!==b.dataset.id);
      save('finance'); render();
    };
  });
  wireFinanceSubtabs(main);
}

function wireFinanceSubtabs(main){
  main.querySelectorAll('.subtab').forEach(s=>{
    s.onclick = ()=>{ financeSubtab = s.dataset.sub; render(); };
  });
}

function renderFinanceAnalytics(main, tx, monthPrefix){
  const monthTx = tx.filter(t=>t.date.startsWith(monthPrefix));
  const income = monthTx.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount),0);
  const expense = monthTx.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0);
  const balance = income - expense;
  const daysPassed = new Date().getDate();
  const avgDaily = daysPassed ? expense/daysPassed : 0;

  const byCat = {};
  monthTx.filter(t=>t.type==='expense').forEach(t=>{ byCat[t.category]=(byCat[t.category]||0)+Number(t.amount); });
  const byIncomeCat = {};
  monthTx.filter(t=>t.type==='income').forEach(t=>{ byIncomeCat[t.category]=(byIncomeCat[t.category]||0)+Number(t.amount); });
  const maxCat = Math.max(1, ...Object.values(byCat));

  main.innerHTML += `
    <div class="stat-row">
      <div class="stat"><div class="num" style="color:var(--moss-ink);">${money(income)}</div><div class="lbl">доходы за месяц</div></div>
      <div class="stat"><div class="num" style="color:var(--coral-ink);">${money(expense)}</div><div class="lbl">расходы за месяц</div></div>

function renderSteps(main){
  const today = todayISO();
  const goal = isWeekend(today) ? 15000 : 12000;
  const current = state.steps.records[today] || 0;
  const pct = Math.min(100, Math.round(current/goal*100));
  const last7 = [];
  for(let i=6;i>=0;i--){

    last7.push({ iso, steps: state.steps.records[iso]||0, goal: isWeekend(iso)?15000:12000 });

  main.innerHTML += `

          <div style="display:flex;justify-content:space-between;font-size:13px;">

        <button id="chat-send">Отправить</button>
      </div>
    </div>
  `;
  const log = main.querySelector('#chat-log');
  log.scrollTop = log.scrollHeight;
  const input = main.querySelector('#chat-input');
  const sendBtn = main.querySelector('#chat-send');
  input.addEventListener('keydown', e=>{

  });
  sendBtn.onclick = async ()=>{
    const text = input.value.trim();
    if(!text) return;
    state.chat.messages.push({ role:'user', content:text });
    save('chat');
    input.value='';
    sendBtn.disabled = true; sendBtn.textContent='...';
    render();
    try{
      const history = state.chat.messages.slice(-16).map(m=>({role:m.role, content:m.content}));
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          model:'claude-sonnet-4-6',
          max_tokens:1000,
          system:'Ты дружелюбный ассистент по образу жизни: помогаешь с рецептами под заданные БЖУ, даёшь практичные советы по личным финансам, привычкам, воде, чтению и уходу за собой. Отвечай на русском языке, кратко и по делу, без лишней воды.',
          messages: history
        })
      });
      const data = await response.json();
      const textBlocks = (data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n');
      state.chat.messages.push({ role:'assistant', content: textBlocks || 'Не получилось получить ответ, попробуй ещё раз.' });
    }catch(e){
      state.chat.messages.push({ role:'assistant', content:'Ошибка соединения. Попробуй ещё раз.' });
    }
    save('chat');
    sendBtn.disabled = false; sendBtn.textContent='Отправить';
    render();
  };
}

function goalForDate(iso){ return isWeekend(iso) ? 15000 : 12000; }

function computeMonthlyFill(){
  const today = todayISO();
  const monthPrefix = today.slice(0,7);
  const daysPassed = new Date().getDate();

  let stepsHit = 0;
  for(let d=1; d<=daysPassed; d++){
    const iso = `${monthPrefix}-${String(d).padStart(2,'0')}`;
    if((state.steps.records[iso]||0) >= goalForDate(iso)) stepsHit++;
  }
  const stepsPct = Math.round(stepsHit/daysPassed*100);

  const nutritionDays = new Set(state.nutrition.entries.filter(e=>e.date.startsWith(monthPrefix)).map(e=>e.date)).size;
  const nutritionPct = Math.round(nutritionDays/daysPassed*100);

  let waterHit=0, skincareHit=0;
  for(let d=1; d<=daysPassed; d++){
    const iso = `${monthPrefix}-${String(d).padStart(2,'0')}`;
    if((state.trackers.water[iso]||0) >= 8) waterHit++;
    const tasksForDay = state.trackers.skincareTasks;
    const doneForDay = state.trackers.skincare[iso] || [];
    if(tasksForDay.length && tasksForDay.every(t=>doneForDay.includes(t))) skincareHit++;
  }
  let customPct = null;
  if(state.trackers.custom.length){
    const perItem = state.trackers.custom.map(c=>{
      let hit=0;
      for(let d=1; d<=daysPassed; d++){
        const iso = `${monthPrefix}-${String(d).padStart(2,'0')}`;
        if((state.trackers.customLog[iso]||[]).includes(c.id)) hit++;
      }
      return hit/daysPassed*100;
    });
    customPct = perItem.reduce((a,b)=>a+b,0)/perItem.length;
  }
  const trackerParts = [Math.round(waterHit/daysPassed*100), Math.round(skincareHit/daysPassed*100)];
  if(customPct!==null) trackerParts.push(Math.round(customPct));
  const trackerPct = Math.round(trackerParts.reduce((a,b)=>a+b,0)/trackerParts.length);

  const monthWorkouts = state.calendar.workouts.filter(w=>w.date.startsWith(monthPrefix));
  const workoutsPct = monthWorkouts.length ? Math.round(monthWorkouts.filter(w=>w.done).length/monthWorkouts.length*100) : 0;

  const financeDays = new Set(state.finance.transactions.filter(t=>t.date.startsWith(monthPrefix)).map(t=>t.date)).size;
  const financePct = Math.round(financeDays/daysPassed*100);

  return [
    { name:'Шаги', pct:stepsPct, color:'var(--sky)' },
    { name:'Рацион', pct:nutritionPct, color:'var(--mustard)' },
    { name:'Трекер (вода, уход, свои)', pct:trackerPct, color:'var(--coral)' },
    { name:'Тренировки', pct:workoutsPct, color:'var(--indigo)' },
    { name:'Финансы', pct:financePct, color:'var(--moss)' }
  ];
}

function renderHome(main){
  main.innerHTML += `<h1>Главная</h1>`;
  main.innerHTML += `

          <div><label>Всего страниц</label><input type="number" id="b-total"></div>
        </div>
        <div class="btn-row"><button id="b-add">Добавить книгу</button></div>
      </div>
      <div id="b-list">
        ${books.map(b=>{
          const pct = b.totalPages ? Math.min(100, Math.round(b.currentPage/b.totalPages*100)) : 0;
          return `<div class="book-item">
            <div style="display:flex;justify-content:space-between;">
              <span class="book-title">${b.title}</span>
              <button class="del" data-id="${b.id}">убрать</button>
            </div>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:var(--coral);"></div></div>
            <div class="row" style="margin-top:8px;align-items:center;">
              <input type="number" class="b-page" data-id="${b.id}" value="${b.currentPage}" style="max-width:100px;">
              <span class="muted">из ${b.totalPages} стр · ${pct}%</span>
            </div>
          </div>`;
        }).join('') || '<div class="empty">Пока нет книг в списке</div>'}
      </div>
    `;
    main.querySelector('#b-add').onclick = ()=>{
      const title = main.querySelector('#b-title').value.trim();
      const totalPages = parseInt(main.querySelector('#b-total').value)||0;
      if(!title) return;
      state.trackers.books.push({ id:uid(), title, totalPages, currentPage:0 });
      save('trackers'); render();
    };
    main.querySelectorAll('.del').forEach(b=>{
      b.onclick = ()=>{ state.trackers.books = state.trackers.books.filter(x=>x.id!==b.dataset.id); save('trackers'); render(); };
    });
    main.querySelectorAll('.b-page').forEach(inp=>{
      inp.onchange = ()=>{
        const book = state.trackers.books.find(x=>x.id===inp.dataset.id);
        if(book){ book.currentPage = parseInt(inp.value)||0; save('trackers'); render(); }
      };
    });
  } else if(trackerSubtab==='skincare'){
    const done = state.trackers.skincare[today] || [];
    const tasks = state.trackers.skincareTasks;
    main.innerHTML += `
      <div class="card">
        <div class="check-grid">
          ${tasks.map(t=>`
            <label class="check-item">
              <input type="checkbox" data-task="${t}" ${done.includes(t)?'checked':''}>
              <span style="flex:1;">${t}</span>
              <span class="del" data-task-del="${t}" style="cursor:pointer;font-size:11px;color:var(--ink-soft);">×</span>
            </label>
          `).join('')}
        </div>
        <div class="row" style="margin-top:12px;">
          <input type="text" id="sc-new" placeholder="добавить свой пункт, например «маска для волос»">
          <button id="sc-add">Добавить</button>
        </div>
      </div>
    `;
    main.querySelectorAll('.check-item input[type=checkbox]').forEach(cb=>{
      cb.onchange = ()=>{
        let arr = state.trackers.skincare[today] || [];
        if(cb.checked) arr = [...new Set([...arr, cb.dataset.task])];
        else arr = arr.filter(t=>t!==cb.dataset.task);
        state.trackers.skincare[today] = arr;
        save('trackers');
      };
    });
    main.querySelectorAll('[data-task-del]').forEach(x=>{
      x.onclick = (e)=>{
        e.preventDefault();
        const t = x.dataset.taskDel;
        state.trackers.skincareTasks = state.trackers.skincareTasks.filter(x2=>x2!==t);
        Object.keys(state.trackers.skincare).forEach(d=>{
          state.trackers.skincare[d] = state.trackers.skincare[d].filter(x2=>x2!==t);
        });
        save('trackers'); render();
      };
    });
    main.querySelector('#sc-add').onclick = ()=>{
      const val = main.querySelector('#sc-new').value.trim();
      if(!val || state.trackers.skincareTasks.includes(val)) return;
      state.trackers.skincareTasks.push(val);
      save('trackers'); render();
    };
  } else {
    const customs = state.trackers.custom;
    const doneToday = state.trackers.customLog[today] || [];
    main.innerHTML += `
      <div class="card">
        <div class="row">
          <div><label>Название пункта</label><input type="text" id="c-name" placeholder="например, растяжка"></div>
          <div><label>Описание</label><input type="text" id="c-desc" placeholder="необязательно"></div>
        </div>
        <div class="btn-row"><button id="c-add">Добавить пункт</button></div>
      </div>
      <div id="c-list">
        ${customs.map(c=>`
          <div class="custom-item">
            <div>
              <div class="ci-name">${escapeHtml(c.name)}</div>
              ${c.description ? `<div class="ci-desc">${escapeHtml(c.description)}</div>` : ''}
            </div>
            <div style="display:flex;align-items:center;gap:12px;">
              <label><input type="checkbox" class="c-check" data-id="${c.id}" ${doneToday.includes(c.id)?'checked':''}>сегодня</label>
              <button class="del" data-id="${c.id}">убрать</button>
            </div>
          </div>
        `).join('') || '<div class="empty">Пока нет своих пунктов — добавь то, что хочешь отслеживать</div>'}
      </div>
    `;
    main.querySelector('#c-add').onclick = ()=>{
      const name = main.querySelector('#c-name').value.trim();
      const description = main.querySelector('#c-desc').value.trim();
      if(!name) return;
      state.trackers.custom.push({ id:uid(), name, description });
      save('trackers'); render();
    };
    main.querySelectorAll('#c-list .del').forEach(b=>{
      b.onclick = ()=>{
        state.trackers.custom = state.trackers.custom.filter(c=>c.id!==b.dataset.id);
        Object.keys(state.trackers.customLog).forEach(d=>{
          state.trackers.customLog[d] = state.trackers.customLog[d].filter(id=>id!==b.dataset.id);
        });
        save('trackers'); render();
      };
    });
    main.querySelectorAll('.c-check').forEach(cb=>{
      cb.onchange = ()=>{
        let arr = state.trackers.customLog[today] || [];
        if(cb.checked) arr = [...new Set([...arr, cb.dataset.id])];
        else arr = arr.filter(id=>id!==cb.dataset.id);
        state.trackers.customLog[today] = arr;
        save('trackers');
      };
    });
  }
  main.querySelectorAll('.subtab').forEach(s=>{
    s.onclick = ()=>{ trackerSubtab = s.dataset.sub; render(); };
  });
}

/* ---------- CALENDAR ---------- */
const dowLabels = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const monthLabels = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];

function renderCalendar(main){
  const today = todayISO();
  const { year, month } = calView;
  const first = new Date(year, month, 1);
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const offset = (first.getDay()+6) % 7;
  const monthPrefix = `${year}-${String(month+1).padStart(2,'0')}`;

  const workoutsByDate = {};
  state.calendar.workouts.forEach(w=>{
    (workoutsByDate[w.date] = workoutsByDate[w.date] || []).push(w);
  });
  const monthWorkouts = state.calendar.workouts.filter(w=>w.date.startsWith(monthPrefix));
  const doneCount = monthWorkouts.filter(w=>w.done).length;

  let cells = '';
  for(let i=0;i<offset;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const list = workoutsByDate[iso] || [];
    const allDone = list.length && list.every(w=>w.done);
    cells += `<div class="cal-cell ${iso===today?'today':''} ${iso===calSelected?'selected':''} ${allDone?'done':''}" data-date="${iso}">
      <span>${d}</span>
      ${list.length ? `<span class="cal-dots">${list.map(()=>'<span></span>').join('')}</span>` : ''}
    </div>`;
  }

  main.innerHTML += `
    <h1>Календарь тренировок</h1>
    <div class="stat-row">
      <div class="stat"><div class="num">${doneCount} / ${monthWorkouts.length}</div><div class="lbl">выполнено в этом месяце</div></div>
    </div>
    <div class="card">
      <div class="cal-head">
        <button class="ghost nav-btn" id="cal-prev">← пред.</button>
        <span class="cal-month">${monthLabels[month]} ${year}</span>
        <button class="ghost nav-btn" id="cal-next">след. →</button>
      </div>
      <div class="cal-grid">
        ${dowLabels.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells}
      </div>
    </div>
    <div class="card">
      <div class="muted" style="margin-bottom:8px;">${fmtDate(calSelected)}</div>
      <div class="list" id="cal-wlist">
        ${(workoutsByDate[calSelected]||[]).map(w=>`
          <div class="workout-item ${w.done?'done':''}">
            <input type="checkbox" class="w-done" data-id="${w.id}" ${w.done?'checked':''}>
            <div style="flex:1;">
              <div class="wi-title">${escapeHtml(w.title)}</div>
              ${w.note ? `<div class="muted">${escapeHtml(w.note)}</div>` : ''}
            </div>
            <button class="del" data-id="${w.id}">убрать</button>
          </div>
        `).join('') || '<div class="empty">На эту дату тренировок не запланировано</div>'}
      </div>
      <div class="row" style="margin-top:12px;">
        <div><label>Тренировка</label><input type="text" id="w-title" placeholder="например, силовая"></div>
        <div><label>Заметка</label><input type="text" id="w-note" placeholder="необязательно"></div>
      </div>
      <div class="btn-row"><button id="w-add">Добавить на ${fmtDate(calSelected)}</button></div>
    </div>
  `;

  main.querySelector('#cal-prev').onclick = ()=>{
    calView.month--; if(calView.month<0){ calView.month=11; calView.year--; }
    render();
  };
  main.querySelector('#cal-next').onclick = ()=>{
    calView.month++; if(calView.month>11){ calView.month=0; calView.year++; }
    render();
  };
  main.querySelectorAll('.cal-cell[data-date]').forEach(c=>{
    c.onclick = ()=>{ calSelected = c.dataset.date; render(); };
  });
  main.querySelector('#w-add').onclick = ()=>{
    const title = main.querySelector('#w-title').value.trim();
    if(!title) return;
    const note = main.querySelector('#w-note').value.trim();
    state.calendar.workouts.push({ id:uid(), date:calSelected, title, note, done:false });
    save('calendar'); render();
  };
  main.querySelectorAll('.w-done').forEach(cb=>{
    cb.onchange = ()=>{
      const w = state.calendar.workouts.find(x=>x.id===cb.dataset.id);
      if(w){ w.done = cb.checked; save('calendar'); render(); }
    };
  });
  main.querySelectorAll('#cal-wlist .del').forEach(b=>{
    b.onclick = ()=>{
      state.calendar.workouts = state.calendar.workouts.filter(w=>w.id!==b.dataset.id);
      save('calendar'); render();
    };
  });
}

/* ---------- BLOG (photo diary) ---------- */
let blogDraftPhotos = [];

function compressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 900;
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height*maxDim/width); width = maxDim; }
          else { width = Math.round(width*maxDim/height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderBlogDraftPreview(main){
  const wrap = main.querySelector('#bl-photo-preview');
  if(!wrap) return;
  wrap.innerHTML = blogDraftPhotos.map((src,i)=>`
    <div style="position:relative;">
      <img src="${src}" style="width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);">
      <span class="del" data-idx="${i}" style="position:absolute;top:-6px;right:-6px;background:var(--ink);color:var(--paper-2);border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;">×</span>
    </div>
  `).join('');
  wrap.querySelectorAll('.del').forEach(x=>{
    x.onclick = ()=>{ blogDraftPhotos.splice(Number(x.dataset.idx),1); renderBlogDraftPreview(main); };
  });
}

function renderBlog(main){
  const posts = state.blog.posts;
  main.innerHTML += `
    <h1>Блог — дневник</h1>
    <div class="card">
      <div class="row">
        <div style="min-width:100%;"><label>Заголовок</label><input type="text" id="bl-title"></div>
      </div>
      <div style="margin-top:8px;"><label>Текст</label><textarea id="bl-text" placeholder="О чём хочешь написать сегодня?"></textarea></div>
      <div style="margin-top:10px;">
        <label>Фото</label>
        <input type="file" id="bl-photo-input" accept="image/*" multiple>
        <div id="bl-photo-preview" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;"></div>
      </div>
      <div class="btn-row"><button id="bl-add">Опубликовать</button></div>
    </div>
    <div id="bl-list">
      ${posts.slice().reverse().map(p=>`
        <div class="blog-post">
          <div style="display:flex;justify-content:space-between;align-items:baseline;">
            <h3>${escapeHtml(p.title)}</h3>
            <button class="del" data-id="${p.id}">удалить</button>
          </div>
          <div class="blog-date">${fmtDate(p.date)}</div>
          ${p.text ? `<div class="blog-text">${escapeHtml(p.text)}</div>` : ''}
          ${(p.photos&&p.photos.length) ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">
            ${p.photos.map(src=>`<img src="${src}" style="width:130px;height:130px;object-fit:cover;border-radius:8px;border:1px solid var(--line);">`).join('')}
          </div>` : ''}
        </div>
      `).join('') || '<div class="empty">Пока нет записей</div>'}
    </div>
  `;
  renderBlogDraftPreview(main);
  main.querySelector('#bl-photo-input').onchange = async (e)=>{
    const files = Array.from(e.target.files);
    for(const f of files){
      try{ blogDraftPhotos.push(await compressImage(f)); }catch(err){ /* skip failed image */ }
    }
    e.target.value = '';
    renderBlogDraftPreview(main);
  };
  main.querySelector('#bl-add').onclick = ()=>{
    const title = main.querySelector('#bl-title').value.trim();
    const text = main.querySelector('#bl-text').value.trim();
    if(!title || (!text && !blogDraftPhotos.length)) return;
    state.blog.posts.push({ id:uid(), date:todayISO(), title, text, photos:[...blogDraftPhotos] });
    blogDraftPhotos = [];
    save('blog'); render();
  };
  main.querySelectorAll('#bl-list .del').forEach(b=>{
    b.onclick = ()=>{ state.blog.posts = state.blog.posts.filter(p=>p.id!==b.dataset.id); save('blog'); render(); };
  });
}

loadAll();
</script>
